name: Publier le site (branche pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-pages
  cancel-in-progress: false

jobs:
  pages:
    runs-on: codeberg-tiny
    timeout-minutes: 20
    steps:
      - name: Récupérer tout l'historique
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: false
          lfs: false
          persist-credentials: false
          show-progress: false

      - name: Publier sur la branche pages
        env:
          CB_USER: ${{ secrets.CODEBERG_USER }}
          CB_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          set -eu
          DEPOT="https://${CB_USER}:${CB_TOKEN}@codeberg.org/MermozLab/sciences.git"
          MOI="$(git rev-parse HEAD)"

          # Déjà à jour : rien à envoyer
          PAGES="$(git ls-remote "$DEPOT" refs/heads/pages | cut -f1)"
          if [ "$PAGES" = "$MOI" ]; then
            echo "pages est déjà à jour."
            exit 0
          fi

          for essai in 1 2 3; do
            if timeout 300 git push --force "$DEPOT" "HEAD:refs/heads/pages"; then
              echo "Publication réussie (essai ${essai})."
              exit 0
            fi
            POINTE="$(git ls-remote "$DEPOT" refs/heads/main | cut -f1)"
            if [ -n "$POINTE" ] && [ "$POINTE" != "$MOI" ]; then
              echo "main a avancé : l'exécution la plus récente publiera."
              exit 0
            fi
            sleep $((essai * 5))
          done
          echo "Publication impossible." >&2
          exit 1