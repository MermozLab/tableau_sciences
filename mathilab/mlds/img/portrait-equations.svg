<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 470" width="500" height="470" role="img" aria-labelledby="t d" font-family="IBM Plex Sans, Segoe UI, sans-serif">
<title id="t">Portrait d'équations (gabarit)</title><desc id="d">Visage à compléter : cinq éléments numérotés (yeux, oreilles, nez, bouche, cheveux), chacun associé à une équation à résoudre.</desc>
<rect width="500" height="470" fill="#FFFFFF"/>
<ellipse cx="250" cy="250" rx="120" ry="155" fill="#FFF8E7" stroke="#1B2A4A" stroke-width="3"/><ellipse cx="128" cy="255" rx="20" ry="40" fill="none" stroke="#1B2A4A" stroke-width="3" stroke-dasharray="6 5"/><ellipse cx="372" cy="255" rx="20" ry="40" fill="none" stroke="#1B2A4A" stroke-width="3" stroke-dasharray="6 5"/><ellipse cx="205" cy="215" rx="26" ry="16" fill="none" stroke="#1B2A4A" stroke-width="3" stroke-dasharray="6 5"/><ellipse cx="295" cy="215" rx="26" ry="16" fill="none" stroke="#1B2A4A" stroke-width="3" stroke-dasharray="6 5"/><path d="M 250 235 L 235 290 L 265 290" fill="none" stroke="#1B2A4A" stroke-width="3" stroke-dasharray="6 5"/><path d="M 205 335 Q 250 370 295 335" fill="none" stroke="#1B2A4A" stroke-width="3" stroke-dasharray="6 5"/><path d="M 150 140 Q 250 60 350 140" fill="none" stroke="#1B2A4A" stroke-width="3" stroke-dasharray="6 5"/><circle cx="205" cy="180" r="13" fill="#1B2A4A"/><text x="205.0" y="185.0" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text><text x="185.0" y="185.0" font-size="13" fill="#1B2A4A" text-anchor="end" font-weight="normal">yeux</text><circle cx="100" cy="190" r="13" fill="#1B2A4A"/><text x="100.0" y="195.0" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text><text x="80.0" y="195.0" font-size="13" fill="#1B2A4A" text-anchor="end" font-weight="normal">oreilles</text><circle cx="215" cy="300" r="13" fill="#1B2A4A"/><text x="215.0" y="305.0" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text><text x="195.0" y="305.0" font-size="13" fill="#1B2A4A" text-anchor="end" font-weight="normal">nez</text><circle cx="345" cy="372" r="13" fill="#1B2A4A"/><text x="345.0" y="377.0" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">4</text><text x="365.0" y="377.0" font-size="13" fill="#1B2A4A" text-anchor="start" font-weight="normal">bouche</text><circle cx="370" cy="95" r="13" fill="#1B2A4A"/><text x="370.0" y="100.0" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">5</text><text x="390.0" y="100.0" font-size="13" fill="#1B2A4A" text-anchor="start" font-weight="normal">cheveux</text><text x="250.0" y="440.0" font-size="13" fill="#445070" text-anchor="middle" font-weight="normal">Une équation par élément : la solution décide du trait à dessiner.</text>
</svg>
