<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" width="560" height="330" role="img" aria-labelledby="t d" font-family="IBM Plex Sans, Segoe UI, sans-serif">
<title id="t">Pile de triangles</title><desc id="d">Quatre triangles rectangles en B. Étape 1 : AB = 8 cm et angle A = 34°, calculer AC. Étape 2 : AC de l'étape 1 et angle A = 28°, calculer BC. Étape 3 : AB égal au BC de l'étape 2 et angle A = 41°, calculer AC. Étape 4 : AB = 3,5 cm et AC de l'étape 3, calculer BC.</desc>
<rect width="560" height="330" fill="#FFFFFF"/>
<polygon points="30.0,110.0 150.0,110.0 150.0,40.0" fill="#F4F6FB" stroke="#1B2A4A" stroke-width="2.5" stroke-linejoin="round"/><path d="M 138 110 L 138 98 L 150 98" fill="none" stroke="#1B2A4A" stroke-width="1.5"/><text x="22.0" y="114.0" font-size="13" fill="#1B2A4A" text-anchor="end" font-weight="normal">A</text><text x="158.0" y="124.0" font-size="13" fill="#1B2A4A" text-anchor="start" font-weight="normal">B</text><text x="158.0" y="40.0" font-size="13" fill="#1B2A4A" text-anchor="start" font-weight="normal">C</text><text x="70.0" y="104.0" font-size="12" fill="#C15B4A" text-anchor="middle" font-weight="normal">34°</text><text x="90.0" y="126.0" font-size="12" fill="#1B2A4A" text-anchor="middle" font-weight="normal">AB = 8 cm</text><text x="160" y="79.0" font-size="12" fill="#1B2A4A">BC</text><text transform="translate(84.0,67.0) rotate(-30)" font-size="12" fill="#1B2A4A" text-anchor="middle">AC = ?</text><text x="90.0" y="22.0" font-size="14" fill="#1B2A4A" text-anchor="middle" font-weight="bold">① cherche AC</text><polygon points="300.0,110.0 420.0,110.0 420.0,40.0" fill="#F4F6FB" stroke="#1B2A4A" stroke-width="2.5" stroke-linejoin="round"/><path d="M 408 110 L 408 98 L 420 98" fill="none" stroke="#1B2A4A" stroke-width="1.5"/><text x="292.0" y="114.0" font-size="13" fill="#1B2A4A" text-anchor="end" font-weight="normal">A</text><text x="428.0" y="124.0" font-size="13" fill="#1B2A4A" text-anchor="start" font-weight="normal">B</text><text x="428.0" y="40.0" font-size="13" fill="#1B2A4A" text-anchor="start" font-weight="normal">C</text><text x="340.0" y="104.0" font-size="12" fill="#C15B4A" text-anchor="middle" font-weight="normal">28°</text><text x="360.0" y="126.0" font-size="12" fill="#1B2A4A" text-anchor="middle" font-weight="normal">AB</text><text x="430" y="79.0" font-size="12" fill="#1B2A4A">BC = ?</text><text transform="translate(354.0,67.0) rotate(-30)" font-size="12" fill="#1B2A4A" text-anchor="middle">AC = résultat ①</text><text x="360.0" y="22.0" font-size="14" fill="#1B2A4A" text-anchor="middle" font-weight="bold">② cherche BC</text><polygon points="30.0,270.0 150.0,270.0 150.0,200.0" fill="#F4F6FB" stroke="#1B2A4A" stroke-width="2.5" stroke-linejoin="round"/><path d="M 138 270 L 138 258 L 150 258" fill="none" stroke="#1B2A4A" stroke-width="1.5"/><text x="22.0" y="274.0" font-size="13" fill="#1B2A4A" text-anchor="end" font-weight="normal">A</text><text x="158.0" y="284.0" font-size="13" fill="#1B2A4A" text-anchor="start" font-weight="normal">B</text><text x="158.0" y="200.0" font-size="13" fill="#1B2A4A" text-anchor="start" font-weight="normal">C</text><text x="70.0" y="264.0" font-size="12" fill="#C15B4A" text-anchor="middle" font-weight="normal">41°</text><text x="90.0" y="286.0" font-size="12" fill="#1B2A4A" text-anchor="middle" font-weight="normal">AB = résultat ②</text><text x="160" y="239.0" font-size="12" fill="#1B2A4A">BC</text><text transform="translate(84.0,227.0) rotate(-30)" font-size="12" fill="#1B2A4A" text-anchor="middle">AC = ?</text><text x="90.0" y="182.0" font-size="14" fill="#1B2A4A" text-anchor="middle" font-weight="bold">③ cherche AC</text><polygon points="300.0,270.0 420.0,270.0 420.0,200.0" fill="#F4F6FB" stroke="#1B2A4A" stroke-width="2.5" stroke-linejoin="round"/><path d="M 408 270 L 408 258 L 420 258" fill="none" stroke="#1B2A4A" stroke-width="1.5"/><text x="292.0" y="274.0" font-size="13" fill="#1B2A4A" text-anchor="end" font-weight="normal">A</text><text x="428.0" y="284.0" font-size="13" fill="#1B2A4A" text-anchor="start" font-weight="normal">B</text><text x="428.0" y="200.0" font-size="13" fill="#1B2A4A" text-anchor="start" font-weight="normal">C</text><text x="340.0" y="264.0" font-size="12" fill="#C15B4A" text-anchor="middle" font-weight="normal"></text><text x="360.0" y="286.0" font-size="12" fill="#1B2A4A" text-anchor="middle" font-weight="normal">AB = 3,5 cm</text><text x="430" y="239.0" font-size="12" fill="#1B2A4A">BC = ?</text><text transform="translate(354.0,227.0) rotate(-30)" font-size="12" fill="#1B2A4A" text-anchor="middle">AC = résultat ③</text><text x="360.0" y="182.0" font-size="14" fill="#1B2A4A" text-anchor="middle" font-weight="bold">④ cherche BC</text><text x="260.0" y="305.0" font-size="12" fill="#445070" text-anchor="middle" font-weight="normal">Chaque résultat sert à l'étape suivante (garder les valeurs non arrondies).</text>
</svg>
