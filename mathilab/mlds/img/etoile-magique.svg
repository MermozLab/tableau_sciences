<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500" role="img" aria-labelledby="t d" font-family="IBM Plex Sans, Segoe UI, sans-serif">
<title id="t">Étoile magique à compléter</title><desc id="d">Étoile à six branches avec douze points. Les nombres 1, 3, 12 et 2 sont placés ; il faut placer 4 à 11 pour que les six alignements de quatre nombres aient la même somme.</desc>
<rect width="500" height="500" fill="#FFFFFF"/>
<line x1="100" y1="167" x2="400" y2="167" stroke="#E2A63B" stroke-width="5" stroke-linecap="round"/><line x1="100" y1="333" x2="400" y2="333" stroke="#E2A63B" stroke-width="5" stroke-linecap="round"/><line x1="250" y1="84" x2="100" y2="333" stroke="#E2A63B" stroke-width="5" stroke-linecap="round"/><line x1="250" y1="84" x2="400" y2="333" stroke="#E2A63B" stroke-width="5" stroke-linecap="round"/><line x1="100" y1="167" x2="250" y2="416" stroke="#E2A63B" stroke-width="5" stroke-linecap="round"/><line x1="400" y1="167" x2="250" y2="416" stroke="#E2A63B" stroke-width="5" stroke-linecap="round"/><circle cx="250" cy="84" r="20" fill="#1B2A4A"/><text x="250.0" y="90.0" font-size="18" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text><circle cx="250" cy="416" r="20" fill="#FFF8E7" stroke="#E2A63B" stroke-width="3"/><circle cx="100" cy="167" r="20" fill="#FFF8E7" stroke="#E2A63B" stroke-width="3"/><circle cx="200" cy="167" r="20" fill="#FFF8E7" stroke="#E2A63B" stroke-width="3"/><circle cx="300" cy="167" r="20" fill="#FFF8E7" stroke="#E2A63B" stroke-width="3"/><circle cx="400" cy="167" r="20" fill="#1B2A4A"/><text x="400.0" y="173.0" font-size="18" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text><circle cx="100" cy="333" r="20" fill="#FFF8E7" stroke="#E2A63B" stroke-width="3"/><circle cx="200" cy="333" r="20" fill="#FFF8E7" stroke="#E2A63B" stroke-width="3"/><circle cx="300" cy="333" r="20" fill="#FFF8E7" stroke="#E2A63B" stroke-width="3"/><circle cx="400" cy="333" r="20" fill="#1B2A4A"/><text x="400.0" y="339.0" font-size="18" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text><circle cx="150" cy="250" r="20" fill="#FFF8E7" stroke="#E2A63B" stroke-width="3"/><circle cx="350" cy="250" r="20" fill="#1B2A4A"/><text x="350.0" y="256.0" font-size="18" fill="#FFFFFF" text-anchor="middle" font-weight="bold">12</text><text x="250.0" y="480.0" font-size="12" fill="#445070" text-anchor="middle" font-weight="normal">Place 4 à 11 : chaque alignement de 4 nombres a la même somme</text>
</svg>
