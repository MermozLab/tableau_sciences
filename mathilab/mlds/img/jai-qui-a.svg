<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 245" width="560" height="245" role="img" aria-labelledby="t d" font-family="IBM Plex Sans, Segoe UI, sans-serif">
<title id="t">J'ai… Qui a ?</title><desc id="d">Trois dominos enchaînés : J'ai 14, qui a 3 fois 5 ; J'ai 15, qui a (2 plus 5) fois 6 ; J'ai 42, qui a racine de 81.</desc>
<rect width="560" height="245" fill="#FFFFFF"/>
<defs><marker id="fl" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#E2A63B"/></marker></defs><rect x="15" y="40" width="150" height="150" rx="12" fill="#F4F6FB" stroke="#1B2A4A" stroke-width="3" /><line x1="15" y1="110" x2="165" y2="110" stroke="#1B2A4A" stroke-width="2"/><text x="90.0" y="68.0" font-size="14" fill="#445070" text-anchor="middle" font-weight="normal">J'ai</text><text x="90.0" y="98.0" font-size="28" fill="#C15B4A" text-anchor="middle" font-weight="bold">14</text><text x="90.0" y="134.0" font-size="14" fill="#445070" text-anchor="middle" font-weight="normal">Qui a</text><text x="90.0" y="164.0" font-size="20" fill="#1B2A4A" text-anchor="middle" font-weight="bold">3 × 5 ?</text><line x1="169" y1="115" x2="196" y2="115" stroke="#E2A63B" stroke-width="4" marker-end="url(#fl)"/><rect x="200" y="40" width="150" height="150" rx="12" fill="#F4F6FB" stroke="#1B2A4A" stroke-width="3" /><line x1="200" y1="110" x2="350" y2="110" stroke="#1B2A4A" stroke-width="2"/><text x="275.0" y="68.0" font-size="14" fill="#445070" text-anchor="middle" font-weight="normal">J'ai</text><text x="275.0" y="98.0" font-size="28" fill="#C15B4A" text-anchor="middle" font-weight="bold">15</text><text x="275.0" y="134.0" font-size="14" fill="#445070" text-anchor="middle" font-weight="normal">Qui a</text><text x="275.0" y="164.0" font-size="20" fill="#1B2A4A" text-anchor="middle" font-weight="bold">(2 + 5) × 6 ?</text><line x1="354" y1="115" x2="381" y2="115" stroke="#E2A63B" stroke-width="4" marker-end="url(#fl)"/><rect x="385" y="40" width="150" height="150" rx="12" fill="#F4F6FB" stroke="#1B2A4A" stroke-width="3" /><line x1="385" y1="110" x2="535" y2="110" stroke="#1B2A4A" stroke-width="2"/><text x="460.0" y="68.0" font-size="14" fill="#445070" text-anchor="middle" font-weight="normal">J'ai</text><text x="460.0" y="98.0" font-size="28" fill="#C15B4A" text-anchor="middle" font-weight="bold">42</text><text x="460.0" y="134.0" font-size="14" fill="#445070" text-anchor="middle" font-weight="normal">Qui a</text><text x="460.0" y="164.0" font-size="20" fill="#1B2A4A" text-anchor="middle" font-weight="bold">√81 ?</text><text x="280.0" y="225.0" font-size="12" fill="#445070" text-anchor="middle" font-weight="normal">« 3 × 5 » = 15 : celui qui a « J'ai 15 » répond, et ainsi de suite jusqu'au retour au premier domino.</text>
</svg>
