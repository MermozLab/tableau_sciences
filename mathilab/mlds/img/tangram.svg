x="130.0" cy="120.0" r="3" fill="#1B2A4A"/><text x="114.0" y="116.0" font-size="14" fill="#1B2A4A" text-anchor="end" font-weight="normal">K</text><circle cx="290.0" cy="280.0" r="3" fill="#1B2A4A"/><text x="282.0" y="300.0" font-size="14" fill="#1B2A4A" text-anchor="end" font-weight="normal">L</text><circle cx="290.0" cy="120.0" r="3" fill="#1B2A4A"/><text x="296.0" y="112.0" font-size="14" fill="#1B2A4A" text-anchor="start" font-weight="normal">M</text><text x="210.0" y="394.0" font-size="12" fill="#445070" text-anchor="middle" font-weight="normal">Sept pièces : 2 grands triangles, 1 moyen, 2 petits,</text><text x="210.0" y="410.0" font-size="12" fill="#445070" text-anchor="middle" font-weight="normal">1 carré et 1 parallélogramme</text>
