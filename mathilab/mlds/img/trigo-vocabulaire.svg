<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" width="560" height="380" role="img" aria-labelledby="t d" font-family="IBM Plex Sans, Segoe UI, sans-serif">
<title id="t">Vocabulaire du triangle rectangle</title><desc id="d">Triangle ABC rectangle en B avec l'angle α en A : côté adjacent AB, côté opposé BC, hypoténuse AC, et les trois rapports trigonométriques.</desc>
<rect width="560" height="380" fill="#FFFFFF"/>
<polygon points="80.0,250.0 380.0,250.0 380.0,60.0" fill="#F4F6FB" stroke="#1B2A4A" stroke-width="3" stroke-linejoin="round"/><path d="M 360 250 L 360 230 L 380 230" fill="none" stroke="#1B2A4A" stroke-width="2"/><path d="M 125 250 A 45 45 0 0 0 118.0 225.9" fill="none" stroke="#C15B4A" stroke-width="3"/><text x="142.0" y="240.0" font-size="18" fill="#C15B4A" text-anchor="middle" font-weight="normal">α</text><text x="66.0" y="256.0" font-size="16" fill="#1B2A4A" text-anchor="middle" font-weight="normal">A</text><text x="394.0" y="266.0" font-size="16" fill="#1B2A4A" text-anchor="middle" font-weight="normal">B</text><text x="394.0" y="58.0" font-size="16" fill="#1B2A4A" text-anchor="middle" font-weight="normal">C</text><text x="230.0" y="276.0" font-size="14" fill="#4C8C6B" text-anchor="middle" font-weight="bold">côté adjacent à α</text><text x="396" y="160" font-size="14" fill="#3E7CB1" font-weight="bold">côté opposé à α</text><text transform="translate(205,138) rotate(-32)" font-size="14" fill="#D9963A" font-weight="bold" text-anchor="middle">hypoténuse</text><text x="250.0" y="322.0" font-size="13" fill="#1B2A4A" text-anchor="middle" font-weight="normal">cos α = adjacent ÷ hypoténuse</text><text x="250.0" y="342.0" font-size="13" fill="#1B2A4A" text-anchor="middle" font-weight="normal">sin α = opposé ÷ hypoténuse</text><text x="250.0" y="362.0" font-size="13" fill="#1B2A4A" text-anchor="middle" font-weight="normal">tan α = opposé ÷ adjacent</text>
</svg>
