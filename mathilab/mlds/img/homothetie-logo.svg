<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 560" width="500" height="560" role="img" aria-labelledby="t d" font-family="IBM Plex Sans, Segoe UI, sans-serif">
<title id="t">Construction du logo par homothéties</title><desc id="d">Triangle équilatéral ABC de centre D et ses images par les homothéties de centre D et de rapports 1,4 ; 2,2 ; 2,5 et −0,9, avec le cercle de rayon 6,6 cm.</desc>
<rect width="500" height="560" fill="#FFFFFF"/>
<circle cx="250" cy="300" r="132.0" fill="none" stroke="#1B2A4A" stroke-width="1.5" stroke-dasharray="6 4"/><polygon points="250.0,150.0 120.1,375.0 379.9,375.0" fill="none" stroke="#3E7CB1" stroke-width="2" /><polygon points="250.0,168.0 135.7,366.0 364.3,366.0" fill="none" stroke="#4C8C6B" stroke-width="2" /><polygon points="250.0,216.0 177.3,342.0 322.7,342.0" fill="none" stroke="#D9963A" stroke-width="2" /><polygon points="250.0,240.0 198.0,330.0 302.0,330.0" fill="#E8ECF5" stroke="#1B2A4A" stroke-width="3" /><polygon points="250.0,354.0 296.8,273.0 203.2,273.0" fill="none" stroke="#C15B4A" stroke-width="2.5" /><g font-size="14" fill="#1B2A4A"><text x="256" y="234">A</text><text x="180" y="344">B</text><text x="310" y="344">C</text></g><circle cx="250" cy="300" r="3.5" fill="#1B2A4A"/><text x="257" y="294" font-size="14" fill="#1B2A4A">D</text><text x="256" y="368" font-size="13" fill="#C15B4A">A'</text><rect x="12" y="14" width="14" height="10" fill="#1B2A4A"/><text x="32" y="24" font-size="12" fill="#1B2A4A">ABC (rapport 1)</text><rect x="12" y="32" width="14" height="10" fill="#D9963A"/><text x="32" y="42" font-size="12" fill="#1B2A4A">rapport 1,4</text><rect x="12" y="50" width="14" height="10" fill="#4C8C6B"/><text x="32" y="60" font-size="12" fill="#1B2A4A">rapport 2,2</text><rect x="12" y="68" width="14" height="10" fill="#3E7CB1"/><text x="32" y="78" font-size="12" fill="#1B2A4A">rapport 2,5</text><rect x="12" y="86" width="14" height="10" fill="#C15B4A"/><text x="32" y="96" font-size="12" fill="#1B2A4A">rapport −0,9 (A'B'C')</text><text x="12" y="118" font-size="12" fill="#1B2A4A">Cercle pointillé : centre D, rayon 6,6 cm</text><text x="12" y="134" font-size="11" fill="#445070">Échelle : 1 cm = 20 px</text>
</svg>
