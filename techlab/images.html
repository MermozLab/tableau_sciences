<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
  <link rel="stylesheet" href="css/techlab.css">
  <title>Optimiser les images — TechLab</title>
</head>
<body class="images">
  <header class="entete">
    <a class="logo" href="index.html" aria-label="TechLab, accueil">
      <span class="logo-icone"><i class="fas fa-screwdriver-wrench" aria-hidden="true"></i></span>
      <span class="logo-texte"><span class="tech">Tech</span><span class="lab">Lab</span></span>
    </a>
    <a class="retour" href="index.html"><i class="fas fa-arrow-left" aria-hidden="true"></i> Accueil TechLab</a>
  </header>
  <main>
    <h1><i class="fas fa-compress" aria-hidden="true"></i> Optimiser les images</h1>
    <p class="sous-titre">Déposez des PNG, JPG ou JPEG : ils sont réduits dans votre navigateur, sans envoi sur Internet. Remplacez ensuite les fichiers de laboratory/assets par les versions allégées (mêmes noms).</p>

    <label class="depot" id="depot" for="fichiers">
      <i class="fas fa-images fa-2x" aria-hidden="true"></i>
      <strong>Glisser les images ici ou cliquer pour choisir</strong>
      <span>Formats acceptés : PNG, JPG, JPEG</span>
      <input id="fichiers" type="file" accept="image/png,image/jpeg" multiple hidden>
    </label>

    <section class="panneau" aria-label="Réglages">
      <div class="reglages">
        <div><label for="largeur">Largeur maximale (pixels)</label><input id="largeur" type="number" min="100" max="6000" step="50" value="1600"></div>
        <div><label for="qualite">Qualité JPEG : <output id="val-q">80</output> %</label><input id="qualite" type="range" min="40" max="95" value="80"></div>
        <div><label for="format">Format de sortie</label>
          <select id="format"><option value="garder">Conserver le format (recommandé)</option><option value="webp">Convertir en WebP (plus léger, références à modifier)</option></select></div>
      </div>
    </section>

    <div id="resultats" hidden>
      <div class="actions" style="margin-bottom:1rem">
        <button id="zip" class="btn" type="button"><i class="fas fa-file-zipper" aria-hidden="true"></i> Télécharger tout (ZIP)</button>
        <button id="vider" class="btn secondaire" type="button"><i class="fas fa-eraser" aria-hidden="true"></i> Vider la liste</button>
        <span id="bilan" role="status" style="align-self:center;font-weight:700"></span>
      </div>
      <div class="table-defil">
        <table>
          <thead><tr><th>Aperçu</th><th>Fichier</th><th>Avant</th><th>Après</th><th>Gain</th><th>Télécharger</th></tr></thead>
          <tbody id="corps"></tbody>
        </table>
      </div>
    </div>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="js/images.js"></script>
</body>
</html>
